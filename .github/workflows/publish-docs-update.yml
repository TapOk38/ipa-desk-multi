name: Publish documentation update
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-docs-update.yml
permissions:
  contents: read
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check application and component preparation
        run: |
          .\tests\Test-Engine.ps1
          .\tests\Test-Tools.ps1
      - name: Package instructions and sources
        run: |
          .\Build-Release.ps1
          git archive --format=zip --prefix=ipa-desk-multi/ --output=dist/ipa-desk-multi-0.3.0-beta.2-source.zip $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          Copy-Item -LiteralPath RELEASE_NOTES.md -Destination dist/RELEASE_NOTES.md
          $sums = Get-ChildItem -LiteralPath dist -File | Sort-Object Name | ForEach-Object {
            (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_.Name
          }
          [IO.File]::WriteAllLines((Join-Path $PWD 'dist/SHA256SUMS.txt'), $sums, [Text.UTF8Encoding]::new($false))
      - name: Verify packaged runtime and instructions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path previous | Out-Null
          gh release download v0.3.0-beta.1 --repo TapOk38/ipa-desk-multi --pattern '*-windows.zip' --dir previous
          if ($LASTEXITCODE -ne 0) { throw 'Previous release download failed' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          Add-Type -AssemblyName System.IO.Compression
          $old = [IO.Compression.ZipFile]::OpenRead((Join-Path $PWD 'previous/ipa-desk-multi-0.3.0-beta.1-windows.zip'))
          $new = [IO.Compression.ZipFile]::OpenRead((Join-Path $PWD 'dist/ipa-desk-multi-0.3.0-beta.2-windows.zip'))
          function Read-EntryBytes($entry) {
            $inputStream=$entry.Open(); $buffer=[IO.MemoryStream]::new()
            try { $inputStream.CopyTo($buffer); return ,$buffer.ToArray() } finally { $inputStream.Dispose(); $buffer.Dispose() }
          }
          try {
            if ($new.Entries.Count -ne 17) { throw 'Unexpected portable file list' }
            foreach ($entry in $new.Entries) {
              $relative = $entry.FullName.Substring('IPA-Desk-Multi/'.Length)
              $packed = [Convert]::ToBase64String((Read-EntryBytes $entry))
              $source = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $PWD $relative)))
              if ($packed -ne $source) { throw ('ZIP differs from repository: '+$relative) }
              if ($relative -match '\.(ps1|cs|cmd)$') {
                $previousEntry = $old.GetEntry($entry.FullName)
                if (-not $previousEntry -or $packed -ne [Convert]::ToBase64String((Read-EntryBytes $previousEntry))) {
                  throw ('Unexpected application code change: '+$relative)
                }
              }
            }
          } finally { $old.Dispose(); $new.Dispose() }
      - name: Publish updated documentation release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist -File | Select-Object -ExpandProperty FullName)
          gh release create v0.3.0-beta.2 --repo TapOk38/ipa-desk-multi --target $env:GITHUB_SHA --title 'IPA Desk Multi 0.3.0-beta.2' --notes-file RELEASE_NOTES.md --prerelease --draft @assets
          if ($LASTEXITCODE -ne 0) { throw 'Draft release upload failed' }
          $release = gh release view v0.3.0-beta.2 --repo TapOk38/ipa-desk-multi --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($release.assets).Count -ne 4) { throw 'Incomplete release assets' }
          gh release edit v0.3.0-beta.2 --repo TapOk38/ipa-desk-multi --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
