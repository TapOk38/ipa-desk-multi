name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Workflow regression (no Apple requests)
        run: .\tests\Test-Engine.ps1
      - name: Pinned component preparation (offline fixtures)
        run: .\tests\Test-Tools.ps1
      - name: Build portable ZIP
        run: .\Build-Release.ps1
