name: Consolidate IPA USB
on:
  push:
    branches: [main]
    paths: ['.github/workflows/consolidate-ipa-usb.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Import published Android sources
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:RUNNER_TEMP 'ipa-usb-source'
          $archive = Join-Path $env:RUNNER_TEMP 'ipa-usb-source.tar'
          git init $source
          if ($LASTEXITCODE -ne 0) { throw 'Source init failed' }
          git -C $source fetch --depth 1 https://github.com/TapOk38/ipa-usb-android.git 6d5cf4998f66d9395607225d99702c30cbf910d4
          if ($LASTEXITCODE -ne 0) { throw 'Source fetch failed' }
          $paths = @(git -C $source ls-tree --name-only FETCH_HEAD | Where-Object { $_ -notin @('.github', 'CONTRIBUTING.md', 'SECURITY.md') })
          git -C $source archive --format=tar "--output=$archive" FETCH_HEAD -- @paths
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          New-Item -ItemType Directory -Force android | Out-Null
          tar -xf $archive -C android
          if ($LASTEXITCODE -ne 0) { throw 'Source extraction failed' }
          git restore --source=HEAD --worktree -- android/README.md android/RELEASE_NOTES.md android/docs/BUILDING.md android/docs/TESTING.md
          if ($LASTEXITCODE -ne 0) { throw 'Guide restoration failed' }
          $allFiles = @(git -C $source ls-tree -r --name-only FETCH_HEAD)
          $checked = 0
          foreach ($file in $allFiles) {
            if ($file -match '^(app/|libs/|test-libs/|gradle/|licenses/|build-tools/)' -or $file -in @('LICENSE','DEPENDENCIES.sha256','Build-Manual.ps1','build.gradle','settings.gradle','gradle.properties','gradlew','gradlew.bat','.gitattributes','.gitignore')) {
              $expected = git -C $source rev-parse "FETCH_HEAD:$file"
              $actual = git hash-object --no-filters -- "android/$file"
              if ($expected -ne $actual) { throw "Source mismatch: $file" }
              $checked++
            }
          }
          Write-Host "Verified $checked unchanged Android source/dependency files."
      - name: Check Android dependency checksums
        working-directory: android
        run: |
          Get-Content DEPENDENCIES.sha256 | ForEach-Object {
            if ($_ -match '^([a-fA-F0-9]{64})\s+(.+)$') {
              $expected = $Matches[1]
              $path = $Matches[2].TrimStart('*')
              if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $expected) { throw "Hash mismatch: $path" }
            } else { throw 'Invalid dependency checksum line' }
          }
      - name: Prepare Android SDK
        run: |
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" 'platforms;android-35' 'build-tools;35.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'SDK setup failed' }
      - name: Compile Android sources and run unit tests
        working-directory: android
        run: .\Build-Manual.ps1 -Sdk $env:ANDROID_HOME -Jdk $env:JAVA_HOME -TestsOnly
      - name: Save Android sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- android
          if ($LASTEXITCODE -ne 0) { throw 'Staging failed' }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "Import IPA USB sources with Android checks"
            if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Push failed' }
          } elseif ($LASTEXITCODE -ne 0) { throw 'Diff failed' }
      - name: Copy verified Android release assets
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = Join-Path $env:RUNNER_TEMP 'ipa-usb-assets'
          New-Item -ItemType Directory -Force $assets | Out-Null
          gh release download v0.6.0-beta.1 --repo TapOk38/ipa-usb-android --dir $assets
          if ($LASTEXITCODE -ne 0) { throw 'Asset download failed' }
          $expectedAssets = '[{"name":"ipa-usb-0.6.0-beta.1.apk","sha256":"790258db8d5082d2e9e634b018e6562909ebf3b86df78b38918ed0f78b48852a"},{"name":"ipa-usb-android-0.6.0-beta.1-source.zip","sha256":"d28ffec95ee1a7fa7d3c6ead1d4e58ee6da3ad1bb66a45fb2cb14b55b95ada20"},{"name":"ipa-usb-dependencies-source.zip","sha256":"c97e5a2f0f38e09e9d525d8d79bfb4ffc6aa61ead4c12624d5a6c6b31f19432b"},{"name":"SHA256SUMS.txt","sha256":"2429c2c936ea94b869e4d6d58c0dd1c2ab61017712929c0c5e15382005853dde"}]' | ConvertFrom-Json
          foreach ($asset in $expectedAssets) {
            $file = Join-Path $assets $asset.name
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $asset.sha256) { throw "Asset mismatch: $($asset.name)" }
          }
          $releaseList = gh release list --limit 100 --json tagName
          if ($LASTEXITCODE -ne 0) { throw 'Release list failed' }
          if (($releaseList | ConvertFrom-Json | Where-Object { $_.tagName -eq 'android-v0.6.0-beta.1' })) { throw 'Android release already exists; inspect before retrying' }
          $target = git rev-parse HEAD
          $files = @($expectedAssets | ForEach-Object { Join-Path $assets $_.name })
          gh release create android-v0.6.0-beta.1 --target $target --title "IPA USB 0.6.0-beta.1 - Android" --notes-file android/RELEASE_NOTES.md --prerelease --draft @files
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed' }
          gh release edit android-v0.6.0-beta.1 --draft=false --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
      - name: Update Windows release navigation
        run: |
          gh release edit v0.3.1-beta.1 --title "IPA Desk Multi 0.3.1-beta.1 - Windows" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Downloader release update failed' }
          gh release edit install-v1.0.0-beta.1 --title "IPA Install 1.0.0-beta.1 - Windows" --notes-file installer/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Installer release update failed' }
