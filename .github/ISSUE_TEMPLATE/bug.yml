name: Ошибка
description: Сообщить о проблеме без личных данных
body:
  - type: markdown
    attributes:
      value: "Не прикладывайте Apple ID, пароль, 2FA, IPA, cookies или ключи. Обезличьте журнал."
  - type: dropdown
    id: app
    attributes:
      label: Программа
      options:
        - IPA Desk Multi — скачивание на Windows
        - IPA Install — установка с Windows
        - IPA USB — установка с Android
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия программы
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: ОС, модели устройств и способ подключения
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги, ожидаемый и фактический результат
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Обезличенный текст ошибки
