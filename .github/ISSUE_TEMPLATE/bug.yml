name: Bug report
description: Report a problem without sharing personal information
body:
  - type: markdown
    attributes:
      value: "Do not attach Apple IDs, passwords, verification codes, IPA files, cookies or keys. Remove personal information from logs."
  - type: dropdown
    id: app
    attributes:
      label: Application
      options:
        - TapOk IPA Downloader — download on Windows
        - TapOk IPA Installer — Windows — install from Windows
        - TapOk IPA Installer — Android — install from Android
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: OS, device models and connection method
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected result and actual result
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Error message with personal information removed